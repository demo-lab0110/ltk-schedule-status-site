name: Update site data

on:
  schedule:
    # Avoid the busiest top-of-hour schedule window on GitHub Actions.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch latest LTK4 site and live data
        env:
          LTK4_GAS_URL: ${{ vars.LTK4_GAS_URL }}
        run: |
          node <<'NODE'
          const fs = await import("node:fs");

          const GAS_URL = process.env.LTK4_GAS_URL;
          if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(GAS_URL || "")) {
            throw new Error("Set repository variable LTK4_GAS_URL to the reviewed read-only deployment");
          }
          const LTK4_BOOK = "1ZnAbrmXoNykWtMwMKZzF_-2HyNnDd6MMH3b-amKDZKc";
          const { selectLtk4Sheets } = await import("./ltk4-selection.mjs");

          async function fetchJsonp(api) {
            const url = `${GAS_URL}?api=${api}&callback=__cb`;
            const response = await fetch(url, {
              headers: { "User-Agent": "ltk-schedule-status-site-data-updater" }
            });
            if (!response.ok) {
              throw new Error(`${api} GAS request failed: ${response.status}`);
            }

            const text = (await response.text()).replace(/^\uFEFF/, "");
            const match = text.match(/^__cb\(([\s\S]*)\);?\s*$/);
            if (!match) {
              throw new Error(`${api} returned invalid JSONP`);
            }

            return JSON.parse(match[1]);
          }

          const sitePayload = await fetchJsonp("site");
          if (!sitePayload.ok || !sitePayload.sheets || sitePayload.publicSchema !== "LTK4-public-v1" || sitePayload.selectionPolicy !== "latest-approved-v1") {
            throw new Error(sitePayload.error || "Invalid site data payload");
          }

          fs.writeFileSync("site-data.json", JSON.stringify({
            ok: true,
            seasonId: "LTK4",
            publicSchema: "LTK4-public-v1",
            selectionPolicy: "latest-approved-v1",
            sourceSpreadsheetId: LTK4_BOOK,
            updatedAt: sitePayload.updatedAt || new Date().toISOString(),
            sheets: selectLtk4Sheets(sitePayload)
          }));

          try {
            const livePayload = await fetchJsonp("live");
            if (!livePayload.ok || livePayload.seasonId !== "LTK4" || livePayload.sourceSpreadsheetId !== LTK4_BOOK) {
              throw new Error(livePayload.error || "Invalid live data payload");
            }
            fs.writeFileSync("live-data.json", JSON.stringify({
              ok: true,
              seasonId: "LTK4",
              sourceSpreadsheetId: LTK4_BOOK,
              updatedAt: livePayload.updatedAt || null,
              configured: Boolean(livePayload.configured),
              streams: livePayload.streams || []
            }));
          } catch (error) {
            console.warn(`LIVE update skipped: ${error.message}`);
            let existingLive;
            try { existingLive = JSON.parse(fs.readFileSync("live-data.json", "utf8")); } catch {}
            if (existingLive?.ok && existingLive.seasonId === "LTK4" && existingLive.sourceSpreadsheetId === LTK4_BOOK) {
              fs.writeFileSync("live-data.json", JSON.stringify({ ...existingLive, stale: true, error: "LIVE refresh unavailable" }));
            } else {
              fs.writeFileSync("live-data.json", JSON.stringify({
                ok: true,
                seasonId: "LTK4",
                sourceSpreadsheetId: LTK4_BOOK,
                updatedAt: null,
                configured: false,
                streams: [],
                error: error.message
              }));
            }
          }
          NODE

      - name: Commit updated data
        run: |
          if git diff --quiet -- site-data.json live-data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data.json live-data.json
          git commit -m "Update site data"
          git push
